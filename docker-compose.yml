# Local / single-node: Next app + Valkey.
# Optional `.env` from `.env.example` (PUBLIC_DOMAIN for real deploys).
# Health: http://127.0.0.1:3000/api/health
services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Always use the compose Valkey service.
      VALKEY_URL: redis://valkey:6379
      # Do not inherit NODE_ENV=development from a local `.env`.
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
    ports:
      - "127.0.0.1:3000:3000"
      # mediasoup WebRtcServer — fixed UDP 40000 (see MEDIASOUP_RTC_UDP_PORT).
      - "40000:40000/udp"
    depends_on:
      valkey:
        condition: service_healthy

  valkey:
    image: valkey/valkey:9
    restart: unless-stopped
    ports:
      # Loopback for `bun run dev` against compose Valkey.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "sh", "-c", "valkey-cli ping"]
      interval: 10s
      timeout: 3s
      retries: 10
