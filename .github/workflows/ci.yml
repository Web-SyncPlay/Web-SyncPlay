# Test on PR/push; build+push multi-arch images on push only.
# docker/metadata-action OCI labels must stay aligned with Dockerfile LABEL lines.
name: CI

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY_IMAGE: websyncplay/websyncplay

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:9
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      VALKEY_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      # Before install: postinstall rebuilds the SW and would mask artifact drift.
      - name: Verify local-media SW artifact
        run: bun run check:local-media-sw

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test:unit

      - name: Integration tests (Valkey)
        run: bun run test:integration

      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps

      - name: Build app
        run: bun run build

      - name: Start app for a11y and e2e
        run: |
          bun run start &
          echo "APP_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null; then
              echo "App healthy"
              exit 0
            fi
            sleep 1
          done
          echo "App failed to become healthy"
          exit 1

      - name: WCAG 2.2 AAA (all pages)
        run: bun run test:a11y
        env:
          E2E_BASE_URL: http://127.0.0.1:3000

      - name: Browser e2e concurrency
        run: bun run test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3000

      - name: WebSocket e2e concurrency
        run: bun run test:e2e:ws
        env:
          E2E_BASE_URL: http://127.0.0.1:3000

      - name: Stop app
        if: always()
        run: |
          if [ -n "${APP_PID:-}" ]; then
            kill "$APP_PID" || true
          fi
          pkill -f "next start" || true

  # Advisory only: workspace typescript → @typescript/typescript6 (IDE). Does not gate PRs/Docker.
  # CI truth remains `bun run typecheck` (TS7 via @typescript/native) in the Test job above.
  typecheck-ide:
    name: Typecheck (IDE TS6, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck with workspace TypeScript 6
        run: ./node_modules/.bin/tsc -p tsconfig.json --noEmit

  docker:
    name: Docker (${{ matrix.platform }})
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      actions: write # buildx GitHub Actions cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          # Keep product URL/docs; metadata-action would otherwise use the GitHub repo URL.
          labels: |
            org.opencontainers.image.title=Web-SyncPlay
            org.opencontainers.image.description=Watch any yt-dlp source in sync—or stream local files to everyone
            org.opencontainers.image.url=https://web-syncplay.de
            org.opencontainers.image.documentation=https://github.com/Yasamato/Web-SyncPlay#readme
            org.opencontainers.image.authors=Yasamato <https://github.com/Yasamato>
          annotations: |
            org.opencontainers.image.title=Web-SyncPlay
            org.opencontainers.image.description=Watch any yt-dlp source in sync—or stream local files to everyone
            org.opencontainers.image.url=https://web-syncplay.de
            org.opencontainers.image.documentation=https://github.com/Yasamato/Web-SyncPlay#readme
            org.opencontainers.image.authors=Yasamato <https://github.com/Yasamato>

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    name: Docker multi-arch manifest
    needs: docker
    if: github.event_name == 'push'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,enable={{is_not_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Web-SyncPlay
            org.opencontainers.image.description=Watch any yt-dlp source in sync—or stream local files to everyone
            org.opencontainers.image.url=https://web-syncplay.de
            org.opencontainers.image.documentation=https://github.com/Yasamato/Web-SyncPlay#readme
            org.opencontainers.image.authors=Yasamato <https://github.com/Yasamato>
          annotations: |
            org.opencontainers.image.title=Web-SyncPlay
            org.opencontainers.image.description=Watch any yt-dlp source in sync—or stream local files to everyone
            org.opencontainers.image.url=https://web-syncplay.de
            org.opencontainers.image.documentation=https://github.com/Yasamato/Web-SyncPlay#readme
            org.opencontainers.image.authors=Yasamato <https://github.com/Yasamato>
        env:
          # imagetools create only supports index / manifest-descriptor annotations.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(-t "$tag")
          done < <(jq -cr '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

          annotation_args=()
          while IFS= read -r ann; do
            annotation_args+=(--annotation "$ann")
          done < <(jq -cr '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

          sources=()
          for digest in *; do
            sources+=("${{ env.REGISTRY_IMAGE }}@sha256:${digest}")
          done

          docker buildx imagetools create "${tag_args[@]}" "${annotation_args[@]}" "${sources[@]}"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
