# Shared Bun + install for CI Node jobs. Caller must checkout first.
name: Setup Bun
description: Install Bun and project dependencies with a frozen lockfile
inputs:
  verify-local-media-sw:
    description: Verify the committed local-media SW before install (postinstall rebuild would mask drift)
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.4.3

    - name: Verify local-media SW artifact
      if: inputs.verify-local-media-sw == 'true'
      shell: bash
      run: bun run check:local-media-sw

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
